apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-debug-backend-master
  namespace: atlas
  labels:
    app: tracking-debug-backend-master
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tracking-debug-backend-master
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: tracking-debug-backend-master
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - generic-compute
      containers:
      - name: tracking-debug-backend-master
        image: ghcr.io/nammayatri/tracking-debug-backend-master:<IMAGE_TAG>
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: VITE_BASE_URL
          value: https://api.sandbox.moving.tech/tracking
        - name: OSRM_SERVER
          value: https://router.project-osrm.org
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        envFrom:
        - secretRef:
            name: tracking-debug-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
